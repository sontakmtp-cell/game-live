<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok LIVE Arcade · Overlay 9:16</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #07090d;
  --fg: #e2e8f0;
  --gold: #f59e0b;
  --red: #ef4444;
  --blue: #3b82f6;
  --green: #10b981;
  --panel: rgba(15, 23, 42, 0.85);
  --line: rgba(245, 158, 11, 0.45);
  --font-display: "Chakra Petch", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  color-scheme: dark;
}
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: var(--font-display);
  color: var(--fg);
  user-select: none;
}
#fit {
  position: fixed;
  inset: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
#stage {
  position: absolute;
  width: 1080px;
  height: 1920px;
  transform-origin: center center;
  overflow: hidden;
  background: var(--bg);
  box-shadow: 0 0 80px rgba(0,0,0,0.9);
}
#three-canvas {
  position: absolute;
  inset: 0;
  width: 1080px;
  height: 1920px;
}
.ui {
  position: absolute;
  z-index: 10;
  pointer-events: none;
}

/* Header Plaque */
#header {
  top: 60px;
  left: 60px;
  right: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.title-box {
  background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
  border: 2px solid var(--gold);
  border-radius: 20px;
  padding: 16px 40px;
  text-align: center;
  box-shadow: 0 0 35px rgba(245, 158, 11, 0.25);
}
.title-box h1 {
  margin: 0;
  font-size: 42px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #fff;
  text-transform: uppercase;
  text-shadow: 0 0 16px rgba(245, 158, 11, 0.6);
}
.title-box p {
  margin: 4px 0 0;
  font-size: 20px;
  color: var(--gold);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* Mandatory Simulation Disclaimer Badge */
.disclaimer-badge {
  background: rgba(239, 68, 68, 0.2);
  border: 1px solid var(--red);
  color: #fca5a5;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 6px 18px;
  border-radius: 999px;
  text-transform: uppercase;
}

/* Wear Bar Meter */
#wear-meter {
  top: 240px;
  left: 80px;
  right: 80px;
  background: var(--panel);
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  padding: 14px 24px;
  backdrop-filter: blur(8px);
}
.wear-labels {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 8px;
}
.wear-track {
  height: 20px;
  background: #1e293b;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #334155;
}
.wear-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
  transition: width 0.3s ease-out;
}

/* Debug Overlay */
#debug-panel {
  position: absolute;
  top: 360px;
  right: 40px;
  background: rgba(10, 15, 25, 0.9);
  border: 1px solid #38bdf8;
  border-radius: 12px;
  padding: 14px 18px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: #e0f2fe;
  z-index: 20;
  pointer-events: auto;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

/* Action Trigger notification */
#action-toast {
  top: 500px;
  left: 50%;
  transform: translateX(-50%) scale(0.9);
  background: rgba(245, 158, 11, 0.95);
  color: #000;
  font-size: 28px;
  font-weight: 700;
  padding: 14px 32px;
  border-radius: 999px;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  letter-spacing: 0.05em;
}
#action-toast.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

/* Quick test shortcuts bar (chỉ hiện khi test local) */
#quick-bar {
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 30;
  pointer-events: auto;
}
.q-btn {
  background: rgba(30, 41, 59, 0.9);
  color: #fff;
  border: 1px solid #64748b;
  border-radius: 12px;
  padding: 12px 20px;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.q-btn:hover {
  border-color: var(--gold);
  background: rgba(245, 158, 11, 0.2);
}
.q-btn.gold {
  border-color: var(--gold);
  color: var(--gold);
}
.q-btn.red {
  border-color: var(--red);
  color: #fca5a5;
}
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <!-- WebGL Three.js Canvas -->
    <canvas id="three-canvas" width="1080" height="1920"></canvas>

    <!-- Header & Brand -->
    <div id="header" class="ui">
      <div class="title-box">
        <h1>TikTok LIVE Arcade</h1>
        <p>Hybrid Video + Real-Time 3D</p>
      </div>
      <div class="disclaimer-badge">
        ⚠ MÔ PHỎNG 3D · KHÔNG CÓ IPHONE THẬT BỊ PHÁ HỦY
      </div>
    </div>

    <!-- Rope Wear Meter -->
    <div id="wear-meter" class="ui">
      <div class="wear-labels">
        <span>ĐỘ SỜN DÂY (ROPE WEAR)</span>
        <span id="wear-val" style="color:var(--gold)">0%</span>
      </div>
      <div class="wear-track">
        <div id="wear-bar" class="wear-fill"></div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="action-toast" class="ui">HIT!</div>

    <!-- Debug Telemetry Overlay -->
    <div id="debug-panel">
      Đang tải vật lý 3D...
    </div>

    <!-- Nút điều khiển nhanh cho kiểm thử P0A -->
    <div id="quick-bar">
      <button class="q-btn gold" id="btnTouchL">Touch Trái (1)</button>
      <button class="q-btn gold" id="btnTouchR">Touch Phải (2)</button>
      <button class="q-btn" id="btnMiss">Miss (3)</button>
      <button class="q-btn" id="btnDouble">Double Hit (4)</button>
      <button class="q-btn red" id="btnReset">Reset (R)</button>
    </div>
  </div>
</div>

<script type="module">
import { OverlayApp } from './public/js/overlay-app.mjs';

// Tự động scale 1080x1920 theo cửa sổ (OBS window/browser source)
const stage = document.getElementById('stage');
function fitStage() {
  const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

// Khởi chạy ứng dụng Three.js Overlay
const canvas = document.getElementById('three-canvas');
const debugPanel = document.getElementById('debug-panel');
const app = new OverlayApp(canvas, debugPanel, stage);
await app.init();

// Hook cập nhật wear bar
const wearBar = document.getElementById('wear-bar');
const wearVal = document.getElementById('wear-val');
setInterval(() => {
  if (app.physics) {
    const w = app.physics.wear || 0;
    wearBar.style.width = `${w}%`;
    wearVal.textContent = `${w}%`;
  }
}, 100);

// Nút bấm & phím tắt kiểm thử nhanh
const toast = document.getElementById('action-toast');
function notify(text) {
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 700);
}

document.getElementById('btnTouchL').onclick = () => { app.triggerAction('touch_left'); notify('⚡ DAO TRÁI CHẠM DÂY!'); };
document.getElementById('btnTouchR').onclick = () => { app.triggerAction('touch_right'); notify('⚡ DAO PHẢI CHẠM DÂY!'); };
document.getElementById('btnMiss').onclick = () => { app.triggerAction('miss'); notify('💨 ĐÁNH HỤT (MISS)'); };
document.getElementById('btnDouble').onclick = () => { app.triggerAction('double_hit'); notify('⚡⚡ DOUBLE HIT LIÊN TIẾP!'); };
document.getElementById('btnReset').onclick = () => { app.triggerAction('reset'); notify('↺ ĐÃ RESET VẬT LÝ'); };

// Phím tắt bàn phím
window.addEventListener('keydown', (e) => {
  if (e.key === '1') document.getElementById('btnTouchL').click();
  if (e.key === '2') document.getElementById('btnTouchR').click();
  if (e.key === '3') document.getElementById('btnMiss').click();
  if (e.key === '4') document.getElementById('btnDouble').click();
  if (e.key === 'r' || e.key === 'R' || e.key === '0') document.getElementById('btnReset').click();
  if (e.key === 'd' || e.key === 'D') {
    debugPanel.style.display = debugPanel.style.display === 'none' ? 'block' : 'none';
  }
});
</script>
</body>
</html>
